{% extends "base.html" %}
{% block title %}
    {{ category }}
{% endblock title %}
{% block top_center %}
    <h1>
        <a href="{{ SITEURL }}/{{ category.url }}"
           rel="bookmark"
           title="Permalink to {{ category|e }} articles">{{ category }} articles</a>
    </h1>
{% endblock top_center %}
{% block content %}
    {{ m.render_article_list(articles) }}
{% endblock content %}
