---
name: 🪄 Autofix
"on":
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * 1"
  push:
    branches:
      - main

jobs:

  autofix:
    uses: kdeldycke/repomatic/.github/workflows/autofix.yaml@f3fd0341a6ffbe9f948e78e3270ca30faf2b2459 # v7.4.1
    secrets:
      REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT }}
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  # Theme-specific jobs below. Repomatic covers neither Pygments, SCSS nor Jinja, so these stay
  # downstream. `repomatic init` keeps every job declared after the managed caller above, so they
  # survive a workflow re-sync.

  sync-pygments-styles:
    name: 🎨 Sync Pygments styles
    # Not "ubuntu-slim": the styles must come from the exact Pygments release the theme depends on,
    # so this job builds the project, and jq parses the style listing.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # uv.lock pins watchfiles 0.24.0, a transitive Pelican dependency that ships no wheel
          # past 3.12 and falls back to a Rust build. Drop this pin once sync-uv-lock has moved
          # the lock forward.
          python-version: "3.12"
      - name: Generate Pygments styles
        run: |
          STYLES=$(uv --no-progress run --frozen -- pygmentize -L styles --json | jq -r '.styles | keys[]')
          for STYLE in $STYLES; do
            CSS_FILE="./plumage/static/css/pygments/$STYLE.css"
            uv --no-progress run --frozen -- pygmentize -f html -S "$STYLE" -a ".highlight" > "$CSS_FILE"
          done
      - id: pr-metadata
        run: >
          uvx --no-progress 'repomatic==7.4.1' pr-body --output-format github-actions
          --template-file .github/pr-sync-pygments-styles.md
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🔗 dependencies"
          branch: sync-pygments-styles
          delete-branch: true
          add-paths: |
            plumage/static/css/pygments/*.css

  format-css:
    name: 💅 Format CSS
    # Not "ubuntu-slim": stylelint and its shareable configs are installed from npm.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install stylelint
        # --no-save keeps the theme's own package.json, which declares the webassets pipeline, free
        # of these CI-only linters. zizmor wants a lockfile install instead, but the only lockfile
        # here is the theme's own, and pynpm installs from it on every user's site build: a linter
        # added there would ship into those builds.
        # zizmor: ignore[adhoc-packages]
        run: npm install --no-save stylelint stylelint-config-standard stylelint-config-sass-guidelines
      - name: Autofix CSS
        # Allowed to fail so the pull request below is still opened with whatever stylelint managed
        # to fix on its own. What it could not fix is reported by the lint workflow.
        # Both calls read .stylelintrc.yaml, which picks the shareable config per file type and
        # carries the theme's deviations from it. Passing --config here would override that file.
        run: |
          npx stylelint --fix --allow-empty-input "plumage/static/**/*.css" || true
          npx stylelint --fix "plumage/static/**/*.scss" || true
      - id: pr-metadata
        run: >
          uvx --no-progress 'repomatic==7.4.1' pr-body --output-format github-actions
          --template-file .github/pr-format-css.md
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: format-css
          delete-branch: true
          # Only commit stylesheets, so the npm install above cannot leak into the pull request. In
          # a git pathspec "*" spans directory separators, so these reach any depth of static/.
          add-paths: |
            plumage/static/*.css
            plumage/static/*.scss

  format-jinja:
    name: 🃏 Format Jinja
    # Not "ubuntu-slim": djlint is installed from the project's own "djlint" extra, which builds it.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # See the sync-pygments-styles job above for why this is pinned.
          python-version: "3.12"
      - name: Autofix Jinja
        run: >
          uv --no-progress run --frozen --extra djlint --
          djlint --reformat --profile jinja --format-css --format-js --warn plumage/templates/*.html
      - id: pr-metadata
        run: >
          uvx --no-progress 'repomatic==7.4.1' pr-body --output-format github-actions
          --template-file .github/pr-format-jinja.md
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: format-jinja
          delete-branch: true
          add-paths: |
            plumage/templates/*.html
