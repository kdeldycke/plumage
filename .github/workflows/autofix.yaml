---
name: 🪄 Autofix
"on":
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * 1"
  push:
    branches:
      - main

permissions: {}

jobs:

  autofix:
    uses: kdeldycke/repomatic/.github/workflows/autofix.yaml@66650046de54a8032f4c38358b7ef8c9ae39e7b5 # v7.11.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT }}
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  # Theme-specific jobs below. Repomatic covers neither Pygments, SCSS nor Jinja, so these stay
  # downstream. `repomatic init` keeps every job declared after the managed caller above, so they
  # survive a workflow re-sync.

  sync-vendored-assets:
    name: 📦 Sync vendored assets
    # Browsers are served these three files directly, so they cannot come from node_modules,
    # which is excluded from the distribution. They are committed instead, and refreshed here
    # from whatever releases the lock file pins, the way sync-pygments-styles regenerates the
    # stylesheets. That is what puts their versions in package.json, where Dependabot bumps
    # them: nothing reads a version out of a URL in a template.
    #
    # Not "ubuntu-slim": the copies have to come from the exact pinned releases, so this job
    # installs the npm tree from the lock file.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Declared rather than inherited from the runner image, which ships whatever Node it was
      # built with and moves it without a commit here. Held to the major, so security patches
      # still arrive: sync-workflow-pins reads `uvx` and `npm install` literals, not this input,
      # so an exact version here would be the one pin nothing bumps.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Node dependencies
        # From the lock file, so the copies match the pinned releases rather than whatever is
        # newest. Not an adhoc install: every package here is the theme's own declared dependency.
        run: npm --prefix ./plumage ci
      - name: Copy vendored assets
        # The icon font is woff2 only, matching the single format main.scss declares in
        # $bootstrap-icons-font-src. Bootstrap's bundle is the one carrying Popper, which the
        # dropdowns need.
        run: |
          cd ./plumage
          cp node_modules/bootstrap-icons/font/fonts/bootstrap-icons.woff2 static/fonts/
          cp node_modules/bootstrap/dist/js/bootstrap.bundle.min.js static/js/
          cp node_modules/masonry-layout/dist/masonry.pkgd.min.js static/js/
      - id: pr-metadata
        run: >
          uvx --no-progress 'repomatic==7.11.0' pr-body --output-format github-actions
          --template-file .github/pr-templates/sync-vendored-assets.md
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🔗 dependencies"
          branch: sync-vendored-assets
          delete-branch: true
          # Only the vendored copies, so the npm install above cannot leak into the pull
          # request. The theme's own static/js/main.js is not minified, so it is never matched.
          add-paths: |
            plumage/static/fonts/*.woff2
            plumage/static/js/*.min.js

  sync-pygments-styles:
    name: 🎨 Sync Pygments styles
    # Not "ubuntu-slim": the styles must come from the exact Pygments release the theme depends on,
    # so this job builds the project.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Generate Pygments styles
        # Through Pygments' own API rather than a shell loop over `pygmentize -S`, which needed
        # jq to read the style listing. jq is whatever the runner image happens to ship, and
        # nothing pins or bumps it; Pygments itself is pinned in pyproject.toml and resolved
        # from uv.lock by --frozen. The output is byte-identical: get_style_defs() is what
        # `pygmentize -S` calls, and the CLI only adds the trailing newline restored here.
        run: |
          uv --no-progress run --frozen -- python - <<'EOF'
          from pathlib import Path

          from pygments.formatters import HtmlFormatter
          from pygments.styles import get_all_styles

          target = Path("plumage/static/css/pygments")
          for style in get_all_styles():
              css = HtmlFormatter(style=style).get_style_defs(".highlight")
              (target / f"{style}.css").write_text(f"{css}\n")
          EOF
      - id: pr-metadata
        run: >
          uvx --no-progress 'repomatic==7.11.0' pr-body --output-format github-actions
          --template-file .github/pr-templates/sync-pygments-styles.md
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🔗 dependencies"
          branch: sync-pygments-styles
          delete-branch: true
          add-paths: |
            plumage/static/css/pygments/*.css

  format-css:
    name: 💅 Format CSS
    # Not "ubuntu-slim": stylelint and its shareable configs are installed from npm.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Same Node as the sync-vendored-assets job above, and for the same reason.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install stylelint
        # --no-save keeps the theme's own package.json, which declares the webassets pipeline, free
        # of these CI-only linters. zizmor wants a lockfile install instead, but the only lockfile
        # here is the theme's own, and pynpm installs from it on every user's site build: a linter
        # added there would ship into those builds.
        # Pinned to the same releases as the lint-css job in lint.yaml, which sync-workflow-pins
        # bumps in lockstep.
        # zizmor: ignore[adhoc-packages]
        run: >
          npm install --no-save
          stylelint@17.14.1
          stylelint-config-standard@40.0.0
          stylelint-config-sass-guidelines@13.0.0
      - name: Autofix stylesheets
        # One call for both extensions, as in the lint-css job: .stylelintrc.yaml selects the
        # shareable config per file type. Allowed to fail so the pull request below is still
        # opened with whatever stylelint managed to fix on its own. What it could not fix is
        # reported by the lint workflow.
        run: npx stylelint --fix "plumage/static/**/*.{css,scss}" || true
      - id: pr-metadata
        run: >
          uvx --no-progress 'repomatic==7.11.0' pr-body --output-format github-actions
          --template-file .github/pr-templates/format-css.md
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: format-css
          delete-branch: true
          # Only commit stylesheets, so the npm install above cannot leak into the pull request. In
          # a git pathspec "*" spans directory separators, so these reach any depth of static/.
          add-paths: |
            plumage/static/*.css
            plumage/static/*.scss

  format-jinja:
    name: 🃏 Format Jinja
    # Not "ubuntu-slim": uvx builds djlint's sdist-only dependencies (editorconfig, cssbeautifier,
    # jsbeautifier) on install.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Autofix Jinja
        # Pinned to the same release as the lint-jinja job in lint.yaml, which sync-workflow-pins
        # bumps in lockstep. Rules and profile come from [tool.djlint] in pyproject.toml.
        run: >
          uvx --no-progress 'djlint==1.43.1'
          --reformat --format-css --format-js --warn plumage/templates/*.html
      - id: pr-metadata
        run: >
          uvx --no-progress 'repomatic==7.11.0' pr-body --output-format github-actions
          --template-file .github/pr-templates/format-jinja.md
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: format-jinja
          delete-branch: true
          add-paths: |
            plumage/templates/*.html
