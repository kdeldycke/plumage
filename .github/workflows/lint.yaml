---
name: 🧹 Lint
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.gif"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.webp"
  pull_request:
    branches-ignore:
      - major-version-increment
      - minor-version-increment
      - prepare-release

jobs:

  lint:
    uses: kdeldycke/repomatic/.github/workflows/lint.yaml@f3fd0341a6ffbe9f948e78e3270ca30faf2b2459 # v7.4.1
    secrets:
      REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT }}
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  # Theme-specific jobs below. Repomatic covers neither SCSS nor Jinja, so these stay downstream.
  # `repomatic init` keeps every job declared after the managed caller above, so they survive a
  # workflow re-sync. Their autofixing counterparts live in autofix.yaml.

  lint-jinja:
    name: 🃏 Lint Jinja
    # Not "ubuntu-slim": uvx builds djlint's sdist-only dependencies (editorconfig, cssbeautifier,
    # jsbeautifier) on install.
    runs-on: ubuntu-24.04
    # Read-only: this job checks out and lints, and opens no pull request. Declared per-job because
    # a top-level `permissions: {}` would starve the managed caller above, which `repomatic init`
    # regenerates without a `permissions:` block of its own.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Lint Jinja
        # Version-pinned so sync-workflow-pins bumps it past the minimum-release-age cooldown.
        # Rules and profile come from [tool.djlint] in pyproject.toml. --github-output renders each
        # finding as a workflow annotation, so they land on the diff instead of only in the log.
        run: uvx --no-progress 'djlint==1.43.1' --lint --github-output plumage/templates/*.html

  lint-css:
    name: 💅 Lint CSS
    # Not "ubuntu-slim": stylelint and its shareable configs are installed from npm.
    runs-on: ubuntu-24.04
    # Read-only: see the lint-jinja job above.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same Node as the npm jobs in autofix.yaml, declared rather than inherited from the
      # runner image, which moves it without a commit here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install stylelint
        # --no-save keeps the theme's own package.json, which declares the webassets pipeline, free
        # of these CI-only linters. zizmor wants a lockfile install instead, but the only lockfile
        # here is the theme's own, and pynpm installs from it on every user's site build: a linter
        # added there would ship into those builds.
        # Version-pinned so sync-workflow-pins bumps them past the minimum-release-age cooldown.
        # zizmor: ignore[adhoc-packages]
        run: >
          npm install --no-save
          stylelint@17.14.1
          stylelint-config-standard@40.0.0
          stylelint-config-sass-guidelines@13.0.0
      - name: Lint stylesheets
        # One call for both extensions: .stylelintrc.yaml selects the shareable config per file
        # type through `overrides`, so nothing here needs to tell CSS and SCSS apart. Passing
        # --config would override that file wholesale.
        run: npx stylelint "plumage/static/**/*.{css,scss}"
