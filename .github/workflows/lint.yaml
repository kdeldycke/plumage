---
name: 🧹 Lint
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.gif"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.webp"
  pull_request:
    branches-ignore:
      - major-version-increment
      - minor-version-increment
      - prepare-release

jobs:

  lint:
    uses: kdeldycke/repomatic/.github/workflows/lint.yaml@f3fd0341a6ffbe9f948e78e3270ca30faf2b2459 # v7.4.1
    secrets:
      REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT }}
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  # Theme-specific jobs below. Repomatic covers neither SCSS nor Jinja, so these stay downstream.
  # `repomatic init` keeps every job declared after the managed caller above, so they survive a
  # workflow re-sync. Their autofixing counterparts live in autofix.yaml.

  lint-jinja:
    name: 🃏 Lint Jinja
    # Not "ubuntu-slim": djlint is installed from the project's own "djlint" extra, which builds it.
    runs-on: ubuntu-24.04
    # Read-only: this job checks out and lints, and opens no pull request. Declared per-job because
    # a top-level `permissions: {}` would starve the managed caller above, which `repomatic init`
    # regenerates without a `permissions:` block of its own.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # uv.lock pins watchfiles 0.24.0, a transitive Pelican dependency that ships no wheel
          # past 3.12 and falls back to a Rust build. Drop this pin once sync-uv-lock has moved
          # the lock forward.
          python-version: "3.12"
      - name: Lint Jinja
        run: >
          uv --no-progress run --frozen --extra djlint --
          djlint --lint --profile jinja plumage/templates/*.html

  lint-css:
    name: 💅 Lint CSS
    # Not "ubuntu-slim": stylelint and its shareable configs are installed from npm.
    runs-on: ubuntu-24.04
    # Read-only: see the lint-jinja job above.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stylelint
        # --no-save keeps the theme's own package.json, which declares the webassets pipeline, free
        # of these CI-only linters. zizmor wants a lockfile install instead, but the only lockfile
        # here is the theme's own, and pynpm installs from it on every user's site build: a linter
        # added there would ship into those builds.
        # zizmor: ignore[adhoc-packages]
        run: npm install --no-save stylelint stylelint-config-standard stylelint-config-sass-guidelines
      # Both steps read .stylelintrc.yaml, which picks the shareable config per file type and
      # carries the theme's deviations from it. Passing --config here would override that file.
      - name: Lint CSS
        # --allow-empty-input because .stylelintignore excludes the generated Pygments stylesheets,
        # which are currently the only CSS the theme carries: the hand-written styles are all SCSS,
        # linted by the step below. The step stays as a guard for any CSS added later.
        run: npx stylelint --allow-empty-input "plumage/static/**/*.css"
      - name: Lint SCSS
        run: npx stylelint "plumage/static/**/*.scss"
