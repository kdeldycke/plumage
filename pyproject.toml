[build-system]
build-backend = "uv_build"
# Unlike repomatic, which leaves uv-build uncapped because it is pure Python, this
# theme ships a large asset tree and an npm toolchain inside the package directory.
# Those are exactly the packaging edge cases the uncapped-version warning guards
# against, so the upper bound stays.
requires = ["uv-build>=0.8"]

[project]
# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
name = "plumage"
version = "5.0.0.dev0"
# Python versions and their status: https://devguide.python.org/versions/
requires-python = ">= 3.10"
description = "🪶 Clean and tidy theme for Pelican, the static site generator"
authors = [{ name = "Kevin Deldycke", email = "kevin@deldycke.com" }]
readme = "readme.md"
license = "GPL-2.0-or-later"
license-files = ["license"]
keywords = [
    'pelican',
    'pelican-theme',
    'stork',
    'static-search',
    'markdown',
    'masonry',
    'myst',
    'theme',
    'bootstrap',
]
classifiers = [
    # See: https://pypi.org/pypi?%3Aaction=list_classifiers
    'Development Status :: 5 - Production/Stable',
    'Environment :: Plugins',
    'Environment :: Web Environment',
    'Framework :: Pelican :: Themes',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'Operating System :: OS Independent',
    'Programming Language :: JavaScript',
    'Programming Language :: Other',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Topic :: Internet :: WWW/HTTP',
    'Topic :: Internet :: WWW/HTTP :: Indexing/Search',
    'Topic :: Text Processing :: Markup :: HTML',
    'Topic :: Text Processing :: Markup :: Markdown',
    'Typing :: Typed',
]
dependencies = [
    "cssmin ~= 0.2.0",              # XXX Unmaintained!
    "libsass ~= 0.23.0",
    "pelican >= 4.8.0",
    "pelican-myst-reader ~= 1.4.0",
    "pelican-webassets ~= 2.0.0",
    "pygments ~= 2.18.0",
    "pynpm ~= 0.2.0",
    "pyquery ~= 2.0.0",
]

[tool.uv.build-backend]
# The theme uses a flat layout: the package sits at the repo root, not under src/.
module-root = ""
# The backend already ships every asset found in the ./plumage subfolder, which is
# what a theme needs. What must not be distributed is listed below: the npm tree
# the webassets pipeline installs at build time, the JS lock file, and local build
# artifacts. The last two entries are redundant with .gitignore, but uv_build does
# not read it, so they have to be repeated here.
source-exclude = [
    "**/node_modules",
    "**/package-lock.json",
    "**/*.egg-info",
    "**/.DS_Store",
]
wheel-exclude = [
    "**/node_modules",
    "**/package-lock.json",
    "**/*.egg-info",
    "**/.DS_Store",
]

[project.optional-dependencies]
djlint = ["djlint ~= 1.35.2"]

[project.urls]
"Homepage" = 'https://github.com/kdeldycke/plumage'
"Documentation" = 'https://github.com/kdeldycke/plumage#settings'
"Download" = "https://github.com/kdeldycke/plumage/releases/tag/v5.0.0.dev0"
"Repository" = 'https://github.com/kdeldycke/plumage'
"Funding" = "https://github.com/sponsors/kdeldycke"
"Issues" = "https://github.com/kdeldycke/plumage/issues"
"Changelog" = "https://github.com/kdeldycke/plumage/blob/main/changelog.md"

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["pyquery", "pynpm", "pelican.*"]

[tool.repomatic]
# The theme compiles its assets with an npm-based webassets pipeline, so the
# sync-gitignore job has to keep Node entries when it regenerates .gitignore.
# Replaces the gitignore-extra-categories input the pre-repomatic autofix
# workflow used to pass to its reusable caller.
gitignore.extra-categories = ["node"]

# The canonical docs.yaml trigger filter lists citation.cff, which this project
# does not carry. Strip it so the generated filters only name paths that exist.
workflow.ignore-paths = ["citation.cff"]

[tool.bumpversion]
current_version = "5.0.0.dev0"
# Parse versions with an optional .devN suffix (PEP 440).
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\.dev(?P<dev>\\d+))?"
serialize = [
  "{major}.{minor}.{patch}.dev{dev}",
  "{major}.{minor}.{patch}",
]
ignore_missing_files = true
allow_dirty = true
parts.dev.optional_value = "release"
# When dev is "release" (its optional value), the .devN suffix is omitted.
# Bumping patch/minor/major resets dev to "0", producing X.Y.Z.dev0.
# Bumping dev goes from "0" to "release", stripping the suffix for release.
parts.dev.values = [ "0", "release" ]

[[tool.bumpversion.files]]
# Update Python package version in any __init__.py file.
glob = "./**/__init__.py"
ignore_missing_version = true

[[tool.bumpversion.files]]
# Update version in [project] section. Anchored to a line start (regex) so it
# does not also match version-suffixed keys like file-version/product-version
# under [tool.nuitka], which contain `version = "X"` as a substring (their
# values collide with the package version on release commits, where the .devN
# suffix is absent).
filename = "./pyproject.toml"
regex = true
search = '(?m)^version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
# Update version in download URL.
filename = "./pyproject.toml"
search = "releases/tag/v{current_version}"
replace = "releases/tag/v{new_version}"

[[tool.bumpversion.files]]
# Keep the numeric file-version/product-version under [tool.nuitka] in sync,
# when present. Nuitka rejects PEP 440 .devN suffixes, so the file-specific
# serialize strips them; the `-version = "` prefix matches both keys at once.
# ignore_missing_version makes this a no-op in projects without [tool.nuitka].
filename = "./pyproject.toml"
ignore_missing_version = true
serialize = [ "{major}.{minor}.{patch}" ]
search = '-version = "{current_version}"'
replace = '-version = "{new_version}"'

[[tool.bumpversion.files]]
# Update the version in Markdown changelog.
filename = "./changelog.md"
search = "## [`{current_version}` (unreleased)]("
replace = "## [`{new_version}` (unreleased)]("

[[tool.bumpversion.files]]
# Update the version in the citation file. Anchored to a line start (regex) so
# it does not also match the `cff-version:` schema field, which would otherwise
# be overwritten with the package version on every bump as soon as the two
# values coincide once.
filename = "./citation.cff"
regex = true
search = "(?m)^version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
# Update the release date in the citation file.
filename = "./citation.cff"
regex = true
search = "date-released: \\d{{4}}-\\d{{2}}-\\d{{2}}"
replace = "date-released: {utcnow:%Y-%m-%d}"
