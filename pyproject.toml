[build-system]
build-backend = "uv_build"
# Left uncapped, like repomatic. uv warns on build that a future breaking uv-build
# release could break the sdist, but a hard ceiling breaks every contributor and
# runner the day the next minor lands, since uv self-updates. The asset tree and
# npm toolchain this theme ships are exercised by the source-exclude/wheel-exclude
# lists below, so a backend regression surfaces as a failed build, not a bad wheel.
requires = [ "uv-build>=0.8" ]

[project]
# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
name = "plumage"
version = "5.0.0.dev0"
description = "🪶 Clean and tidy theme for Pelican, the static site generator"
readme = "readme.md"
keywords = [
  "bootstrap",
  "markdown",
  "masonry",
  "myst",
  "pelican",
  "pelican-theme",
  "static-search",
  "stork",
  "theme",
]
license = "GPL-2.0-or-later"
license-files = [ "license" ]
authors = [ { name = "Kevin Deldycke", email = "kevin@deldycke.com" } ]
# Python versions and their status: https://devguide.python.org/versions/
requires-python = ">=3.11"
classifiers = [
  # See: https://pypi.org/pypi?%3Aaction=list_classifiers
  "Development Status :: 5 - Production/Stable",
  "Environment :: Plugins",
  "Environment :: Web Environment",
  "Framework :: Pelican :: Themes",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Other",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed"
]
dependencies = [
  # Minifies the compiled stylesheet, as the last filter of the {% assets %} pipeline in
  # base.html. webassets' cssmin filter imports the module by name. The floor is also the
  # ceiling in practice: 0.2.0 is the last release the project ever published.
  # XXX Unmaintained!
  "cssmin>=0.2",
  # Compiles the theme's SCSS, through webassets' libsass filter in that same pipeline.
  # No API boundary to anchor this one to: the filter only ever calls sass.compile() with
  # output_style, include_paths and string/filename, stable across the whole 0.x line. 0.22
  # is just the oldest release checked to install and compile across our Python range, so
  # treat it as a tested floor rather than a real minimum.
  "libsass>=0.22",
  # Pelican 4.12.0 is the first release to require Python 3.11, aligning with the
  # requires-python above. It also lifts its own Pygments ceiling to < 2.20.0.
  "pelican>=4.12",
  # Parses the site's Markdown, and gives it the MyST directive syntax on top: the
  # ```{note} fenced blocks in particular. It claims every extension Pelican's own
  # MarkdownReader answers to (md, markdown, mkd, mdown) plus mkdn, mdwn, Rmd and myst,
  # and registers late enough to win all of them, so Python Markdown would never see a
  # file and the `markdown` extra is not worth carrying.
  "pelican-myst-reader>=1.4",
  # setup_webassets() hands the theme's configuration over as conf["WEBASSETS_CONFIG"].
  # 2.0.0 introduced that key, falling back to the older ASSET_CONFIG; 1.0.0 reads neither,
  # so every filter would run unconfigured instead of failing.
  "pelican-webassets>=2",
  # Generates the stylesheets under static/css/pygments/, one per style, which CODE_STYLE
  # picks between and ALL_CODE_STYLES validates against. 2.18.0 is the first release to know
  # all 49 the theme ships: 2.17.2 is missing `coffee`, so sync-pygments-styles would quietly
  # stop refreshing a stylesheet that is still shipped and still accepted as a CODE_STYLE.
  "pygments>=2.18",
  # postcss_config() installs the theme's Node dependencies through NPMPackage(...).install().
  # 0.2.0 is where that method arrived: 0.1.x exposes the class without it.
  "pynpm>=0.2",
  # Drives the post-generation rewrites in dom_transforms.py: add_class(), attr(), wrap()
  # and outerHtml(), over a pq(filename=...) document. 2.0.0 opens the modern line and
  # already carries all of them, wrap() included.
  "pyquery>=2",
]
urls.Changelog = "https://github.com/kdeldycke/plumage/blob/main/changelog.md"
urls.Documentation = "https://github.com/kdeldycke/plumage#settings"
urls.Download = "https://github.com/kdeldycke/plumage/releases/tag/v5.0.0.dev0"
urls.Funding = "https://github.com/sponsors/kdeldycke"
urls.Homepage = "https://github.com/kdeldycke/plumage"
urls.Issues = "https://github.com/kdeldycke/plumage/issues"
urls.Repository = "https://github.com/kdeldycke/plumage"

[dependency-groups]
test = [
  "pytest>=8.4",
  # Both are required by the addopts under [tool.pytest.ini_options].
  "pytest-cov>=7",
  "pytest-xdist[psutil]>=3.8",
]

[tool.uv]
required-version = ">=0.11.15"
# pelican-myst-reader 1.4.0 caps myst-parser below 5.0.0, and myst-parser 4.x in turn caps
# docutils below 0.22, which Pelican 4.12.0 requires. The two are irreconcilable: without
# this override `uv lock` fails outright with unsatisfiable requirements. An override is the
# only lever that works, since it replaces the reader's own declaration; a direct
# `myst-parser` dependency would just be one more party to the same conflict.
#
# No upper bound on purpose. A ceiling here would be the very thing this override exists to
# undo, and it only ever silences the signal: overrides are workspace-local and never reach
# consumers of the published wheel, so a myst-parser that does break the reader shows up in
# CI rather than in someone else's resolver.
#
# The reader's cap is stale rather than a real incompatibility. Every breaking change in
# myst-parser 5.0.0 is a dependency floor (Python 3.11, Sphinx 8, docutils 0.20,
# markdown-it-py 4), with no API removed, and the reader only reaches for MdParserConfig,
# create_md_parser and read_topmatter. Rendering a document covering emphasis, links, inline
# code, headings, blockquotes, highlighted code blocks, tables, admonitions, footnotes and
# definition lists yields byte-identical HTML under myst-parser 4.0.1 and 5.1.0.
#
# Drop this once the reader relaxes its own pin: https://github.com/ashwinvis/myst-reader
override-dependencies = [ "myst-parser>=5" ]
exclude-newer = "1 week"
# The theme uses a flat layout: the package sits at the repo root, not under src/.
build-backend.module-root = ""
# The backend already ships every asset found in the ./plumage subfolder, which is
# what a theme needs. What must not be distributed is listed below: the npm tree
# the webassets pipeline installs at build time, the JS lock file, and local build
# artifacts. The last two entries are redundant with .gitignore, but uv_build does
# not read it, so they have to be repeated here.
build-backend.source-exclude = [
  "**/node_modules",
  "**/package-lock.json",
  "**/*.egg-info",
  "**/.DS_Store",
]
build-backend.wheel-exclude = [
  "**/node_modules",
  "**/package-lock.json",
  "**/*.egg-info",
  "**/.DS_Store",
]

[tool.djlint]
profile = "jinja"
# Rules the theme opts out of, and why each does not apply. Kept here rather than as
# --ignore flags in the workflows, so the list lives in one place instead of both
# lint.yaml and autofix.yaml, and a local `djlint --lint` behaves like CI.
#
#   H030  Wants a meta description. Filling it properly means deriving per-page content,
#         which is a feature rather than a lint fix.
#   T028  Wants spaceless tags inside attribute values. It fires on one button in
#         archives.html while leaving the identical `class="... {% if %}...{% endif %}"`
#         pattern in base.html (lines 117 and 127) unflagged.
#
# H006 (width/height on <img>) and H031 (meta keywords) were listed here too, until djlint
# 1.42.1 moved both to opt-in for the reasons this file already gave: the theme's two <img>
# hits are user-supplied URLs whose dimensions it cannot know, and search engines dropped
# the keywords meta over a decade ago. Ignoring them no longer does anything.
ignore = "H030,T028"

# H025 reports an orphan tag. Scoped to the one file it misreads rather than ignored
# outright, because it also catches real nesting errors: 1.40.4 taught it to report a list
# inside a <p>, which found one in projects.html that the blanket ignore had been hiding.
#
# What remains here is a genuine false positive: the </dl> in archives.html is emitted
# conditionally inside the loop that opens the matching <dl> whenever the month changes.
# The other one this used to cover, an unclosed <head> in base.html, was fixed upstream.
[tool.djlint.per-file-ignores]
"archives.html" = "H025"

[tool.typos]
default.extend-identifiers = { Github = "GitHub", IOS = "iOS", Javascript = "JavaScript", MacOS = "macOS", PyPi = "PyPI", Typescript = "TypeScript" }
# False positives: "astroid" is a Python AST library (not "asteroid"); "oject" appears when "pyproject.toml" is split across line breaks in CLI help output; "sur" is macOS 11 Big Sur and Homebrew's big_sur bottle tag (not "sure").
default.extend-words = { astroid = "astroid", oject = "oject", sur = "sur", certifi = "certifi", ges = "ges" }
# Skip content between <!-- typos:off --> and <!-- typos:on --> markers.
default.extend-ignore-re = [ "(?s)<!-- typos:off -->.*?<!-- typos:on -->" ]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true
warn_unused_configs = true
overrides = [ { module = [ "pelican.*", "pynpm", "pyquery" ], ignore_missing_imports = true } ]

[tool.pytest]
# Restrict collection to the test suite, so pytest never descends into the
# package or an installed copy of it in dual-copy builds.
ini_options.testpaths = [ "tests" ]
# XXX repomatic 7.4.1 generates this table as [tool.pytest], which pytest ignores
# outright: the section it reads is [tool.pytest.ini_options]. Renamed by hand, so
# expect the next `repomatic init pytest` to undo it until the fix lands upstream.
ini_options.addopts = [
  # Show the N slowest tests.
  "--durations=10",
  # Coverage settings - customize the package name for your project. The test
  # workflow passes --cov-report=xml on the command line to produce the
  # Codecov artifact, keeping it out of local runs.
  "--cov=plumage",
  "--cov-branch",
  "--cov-precision=2",
  "--cov-report=term",
  # Run tests in parallel across all logical cores. Requires the
  # pytest-xdist[psutil] test dependency.
  "--numprocesses=auto",
  # Import test modules via importlib instead of prepending their root dir to
  # sys.path. Avoids "import file mismatch" collection errors when an installed
  # copy of the package coexists with the source tree, as in distro builds.
  "--import-mode=importlib",
]
ini_options.markers = [
  "once: Tests that only need to run once, not across the full CI matrix.",
]
# Make sure tests that are expected to fail do not resurrect and start working.
ini_options.xfail_strict = true

[tool.bumpversion]
current_version = "5.0.0.dev0"
# Parse versions with an optional .devN suffix (PEP 440).
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\.dev(?P<dev>\\d+))?"
serialize = [
  "{major}.{minor}.{patch}.dev{dev}",
  "{major}.{minor}.{patch}",
]
ignore_missing_files = true
allow_dirty = true
parts.dev.optional_value = "release"
# When dev is "release" (its optional value), the .devN suffix is omitted.
# Bumping patch/minor/major resets dev to "0", producing X.Y.Z.dev0.
# Bumping dev goes from "0" to "release", stripping the suffix for release.
parts.dev.values = [ "0", "release" ]

[[tool.bumpversion.files]]
# Update Python package version in any __init__.py file.
glob = "./**/__init__.py"
ignore_missing_version = true

[[tool.bumpversion.files]]
# Update version in [project] section. Anchored to a line start (regex) so it
# does not also match version-suffixed keys like file-version/product-version
# under [tool.nuitka], which contain `version = "X"` as a substring (their
# values collide with the package version on release commits, where the .devN
# suffix is absent).
filename = "./pyproject.toml"
regex = true
search = '(?m)^version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
# Update version in download URL.
filename = "./pyproject.toml"
search = "releases/tag/v{current_version}"
replace = "releases/tag/v{new_version}"

[[tool.bumpversion.files]]
# Keep the numeric file-version/product-version under [tool.nuitka] in sync,
# when present. Nuitka rejects PEP 440 .devN suffixes, so the file-specific
# serialize strips them; the `-version = "` prefix matches both keys at once.
# ignore_missing_version makes this a no-op in projects without [tool.nuitka].
filename = "./pyproject.toml"
ignore_missing_version = true
serialize = [ "{major}.{minor}.{patch}" ]
search = '-version = "{current_version}"'
replace = '-version = "{new_version}"'

[[tool.bumpversion.files]]
# Update the version in Markdown changelog.
filename = "./changelog.md"
search = "## [`{current_version}` (unreleased)]("
replace = "## [`{new_version}` (unreleased)]("

[[tool.bumpversion.files]]
# Update the version in the citation file. Anchored to a line start (regex) so
# it does not also match the `cff-version:` schema field, which would otherwise
# be overwritten with the package version on every bump as soon as the two
# values coincide once.
filename = "./citation.cff"
regex = true
search = "(?m)^version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
# Update the release date in the citation file.
filename = "./citation.cff"
regex = true
search = "date-released: \\d{{4}}-\\d{{2}}-\\d{{2}}"
replace = "date-released: {utcnow:%Y-%m-%d}"

[tool.repomatic]
# The theme compiles its assets with an npm-based webassets pipeline, so the
# sync-gitignore job has to keep Node entries when it regenerates .gitignore.
# Replaces the gitignore-extra-categories input the pre-repomatic autofix
# workflow used to pass to its reusable caller.
gitignore.extra-categories = [ "node" ]
# The canonical docs.yaml trigger filter lists citation.cff, which this project
# does not carry. Strip it so the generated filters only name paths that exist.
workflow.ignore-paths = [ "citation.cff" ]
